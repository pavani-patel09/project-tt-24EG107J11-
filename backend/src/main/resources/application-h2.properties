# ===================================================================
# MediKiosk AI Platform — H2 In-Memory Database Profile (Zero Setup)
# Run with: mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ===================================================================

server.port=8080

# --- H2 Database Configuration (MySQL compatibility mode) ---
spring.datasource.url=jdbc:h2:mem:medikiosk_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Hibernate / JPA Configuration ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Jackson JSON Serialization (Snake Case for Frontend Compatibility) ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=ALWAYS
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Multipart File Upload Limits ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Application Custom Properties ---
medikiosk.upload.dir=./uploads
medikiosk.jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
medikiosk.jwt.expiration-hours=24
medikiosk.gemini.api-key=

# Static Uploads Resource Mapping
spring.web.resources.static-locations=file:./uploads/,classpath:/static/
