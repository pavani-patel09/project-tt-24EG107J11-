# ===================================================================
# MediKiosk AI Platform — Spring Boot & SQL Database Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=

# --- MySQL Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/medikiosk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Jackson JSON Serialization (Snake Case for Frontend Compatibility) ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=ALWAYS
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Multipart File Upload Limits ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Application Custom Properties ---
medikiosk.upload.dir=./uploads
medikiosk.jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
medikiosk.jwt.expiration-hours=24
medikiosk.gemini.api-key=

# Static Uploads Resource Mapping
spring.web.resources.static-locations=file:./uploads/,classpath:/static/
