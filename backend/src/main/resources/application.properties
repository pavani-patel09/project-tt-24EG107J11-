# ===================================================================
# MediKiosk AI Platform — Spring Boot & SQL Database Configuration
# Supports local MySQL default and production overrides via Environment Variables
# ===================================================================

# Server Port (Railway dynamic port support)
server.port=${PORT:8080}
server.servlet.context-path=

# --- MySQL Database Configuration ---
# Configured via environment variables / .env
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Jackson JSON Serialization (Snake Case for Frontend Compatibility) ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=ALWAYS
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Multipart File Upload Limits ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Application Custom Properties ---
medikiosk.upload.dir=./uploads
medikiosk.jwt.secret=${JWT_SECRET}
medikiosk.jwt.expiration-hours=24
medikiosk.gemini.api-key=${GEMINI_API_KEY:}
medikiosk.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# --- Actuator Health Check Configuration ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Static Uploads Resource Mapping
spring.web.resources.static-locations=file:./uploads/,classpath:/static/
